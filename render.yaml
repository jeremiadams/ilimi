databases:
  - name: ilimi-db
    plan: free
    databaseName: ilimi
    user: ilimi

services:
  - type: web
    plan: free
    name: ilimi
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ilimi-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_PROJECT_ID
        sync: false
      - key: PAYSTACK_KEY
        sync: false
      - key: PAYSTACK_PLAN_ID
        sync: false
      - key: KINDE_CLIENT_ID
        sync: false
      - key: KINDE_CLIENT_SECRET
        sync: false
      - key: KINDE_ISSUER_URL
        sync: false
      - key: KINDE_SITE_URL
        sync: false
      - key: KINDE_POST_LOGOUT_REDIRECT_URL
        sync: false
      - key: KINDE_POST_LOGIN_REDIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_ANALYTICS
        sync: false
